<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser Face Recognition</title><script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#eef6ff;color:#172033;font:16px/1.6 Arial}main{max-width:900px;margin:auto;background:white;padding:24px;border-radius:16px;box-shadow:0 10px 30px #164d7822}h1,h2{color:#0d47a1}button,input{padding:10px 14px;margin:5px;border-radius:7px;border:1px solid #9bb8d2}button{background:#1565c0;color:white}.stage{position:relative;max-width:640px;min-height:280px;margin:15px auto;background:#172033}.stage video,.stage img{display:block;width:100%}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.panel{padding:13px;margin:12px 0;background:#e3f2fd;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #bdd5e8;padding:8px}</style></head><body><main><h1>Browser Face Recognition</h1><p>Start the camera, enter a name, and enrol several samples. Recognition compares the current embedding with enrolled samples.</p><input id="personName" placeholder="Person name"><button id="load">Load Models</button><button id="start" disabled>Start Camera</button><button id="enrol" disabled>Enrol</button><button id="recognize" disabled>Recognize</button><button id="attendance" disabled>Start Attendance</button><button id="export">Export CSV</button><div class="stage"><video id="video" autoplay playsinline muted></video></div><div id="people" class="panel">No one enrolled.</div><table><thead><tr><th>Name</th><th>First seen</th></tr></thead><tbody id="rows"></tbody></table><div id="status" class="panel">Load the models to begin.</div></main><script>const MODEL_URL="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model";const status=document.getElementById('status'),video=document.getElementById('video'),people=document.getElementById('people'),rows=document.getElementById('rows');let db=JSON.parse(localStorage.getItem('lwcFaces')||'{}'),present={},stream,timer;async function loadModels(extra){status.textContent='Loading models...';let a=[faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL)];if(extra==='recognition')a.push(faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL));else a.push(faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL));await Promise.all(a);status.textContent='Models ready.'};async function descriptor(){const r=await faceapi.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();return r&&r.descriptor}function matcher(){return new faceapi.FaceMatcher(Object.entries(db).map(([n,a])=>new faceapi.LabeledFaceDescriptors(n,a.map(x=>new Float32Array(x)))),0.55)}function show(){people.textContent=Object.keys(db).length?'Enrolled: '+Object.keys(db).join(', '):'No one enrolled.'}load.onclick=async()=>{await loadModels('recognition');start.disabled=false;load.disabled=true};start.onclick=async()=>{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});video.srcObject=stream;await video.play();enrol.disabled=recognize.disabled=attendance.disabled=false};enrol.onclick=async()=>{const n=personName.value.trim(),d=await descriptor();if(!n||!d)return status.textContent='Enter a name and show one clear face.';(db[n]??=[]).push(Array.from(d));localStorage.setItem('lwcFaces',JSON.stringify(db));show();status.textContent=n+' enrolled.'};recognize.onclick=async()=>{if(!Object.keys(db).length)return status.textContent='Enrol someone first.';const d=await descriptor();status.textContent=d?'Result: '+matcher().findBestMatch(d).toString():'No face found.'};attendance.onclick=()=>{if(timer){clearInterval(timer);timer=null;attendance.textContent='Start Attendance';return}if(!Object.keys(db).length)return status.textContent='Enrol first.';attendance.textContent='Stop Attendance';timer=setInterval(async()=>{const d=await descriptor();if(!d)return;const x=matcher().findBestMatch(d);if(x.label!=='unknown'&&!present[x.label]){present[x.label]=new Date().toLocaleString();rows.innerHTML=Object.entries(present).map(([n,t])=>'<tr><td>'+n+'</td><td>'+t+'</td></tr>').join('');status.textContent=x.label+' marked present.'}},1200)};document.getElementById('export').onclick=()=>{const csv='Name,First Seen\n'+Object.entries(present).map(x=>x.join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='attendance.csv';a.click()};show();window.onbeforeunload=()=>{clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop())}</script></body></html>
