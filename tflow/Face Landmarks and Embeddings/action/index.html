<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face Landmarks and Embeddings</title><script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#eef6ff;color:#172033;font:16px/1.6 Arial}main{max-width:900px;margin:auto;background:white;padding:24px;border-radius:16px;box-shadow:0 10px 30px #164d7822}h1,h2{color:#0d47a1}button,input{padding:10px 14px;margin:5px;border-radius:7px;border:1px solid #9bb8d2}button{background:#1565c0;color:white}.stage{position:relative;max-width:640px;min-height:280px;margin:15px auto;background:#172033}.stage video,.stage img{display:block;width:100%}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.panel{padding:13px;margin:12px 0;background:#e3f2fd;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #bdd5e8;padding:8px}</style></head><body><main><h1>Face Landmarks and Embeddings</h1><p>Upload a clear face photo. The model will draw 68 landmarks and produce a 128-number embedding.</p><button id="load">Load Models</button><input id="file" type="file" accept="image/*" disabled><div class="stage"><img id="photo"><canvas id="canvas"></canvas></div><pre id="out" class="panel">No descriptor yet.</pre><div id="status" class="panel">Load the models to begin.</div></main><script>const MODEL_URL="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model";const status=document.getElementById('status'),photo=document.getElementById('photo'),canvas=document.getElementById('canvas');async function loadModels(extra){status.textContent='Loading models...';let a=[faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL)];if(extra==='recognition')a.push(faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL));else a.push(faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL));await Promise.all(a);status.textContent='Models ready.'};document.getElementById('load').onclick=async()=>{await loadModels('recognition');file.disabled=false;load.disabled=true};file.onchange=()=>{if(file.files[0])photo.src=URL.createObjectURL(file.files[0])};photo.onload=async()=>{canvas.width=photo.naturalWidth;canvas.height=photo.naturalHeight;const r=await faceapi.detectSingleFace(photo,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();if(!r)return status.textContent='No face found.';faceapi.draw.drawDetections(canvas,[r]);faceapi.draw.drawFaceLandmarks(canvas,[r]);out.textContent='Length: '+r.descriptor.length+'\nFirst 12 values: '+Array.from(r.descriptor).slice(0,12).map(x=>x.toFixed(4)).join(', ');status.textContent='Embedding created.'}</script></body></html>
