<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Emotion Recognition</title><script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#eef6ff;color:#172033;font:16px/1.6 Arial}main{max-width:900px;margin:auto;background:white;padding:24px;border-radius:16px;box-shadow:0 10px 30px #164d7822}h1,h2{color:#0d47a1}button,input{padding:10px 14px;margin:5px;border-radius:7px;border:1px solid #9bb8d2}button{background:#1565c0;color:white}.stage{position:relative;max-width:640px;min-height:280px;margin:15px auto;background:#172033}.stage video,.stage img{display:block;width:100%}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.panel{padding:13px;margin:12px 0;background:#e3f2fd;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #bdd5e8;padding:8px}</style></head><body><main><h1>Live Emotion Recognition</h1><p>These are uncertain visible-expression estimates, not facts about feelings.</p><button id="load">Load Models</button><button id="start" disabled>Start Camera</button><button id="stop" disabled>Stop</button><div class="stage"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas></div><div id="status" class="panel">Load the models to begin.</div></main><script>const MODEL_URL="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model";const status=document.getElementById('status'),video=document.getElementById('video'),canvas=document.getElementById('canvas');let stream,running=false;async function loadModels(extra){status.textContent='Loading models...';let a=[faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL)];if(extra==='recognition')a.push(faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL));else a.push(faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL));await Promise.all(a);status.textContent='Models ready.'};load.onclick=async()=>{await loadModels('expression');start.disabled=false;load.disabled=true};start.onclick=async()=>{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});video.srcObject=stream;await video.play();running=true;stop.disabled=false;start.disabled=true;loop()};async function loop(){if(!running)return;const r=await faceapi.detectAllFaces(video,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceExpressions();canvas.width=video.videoWidth;canvas.height=video.videoHeight;const x=faceapi.resizeResults(r,{width:canvas.width,height:canvas.height}),c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);faceapi.draw.drawDetections(canvas,x);faceapi.draw.drawFaceExpressions(canvas,x);status.textContent='Faces analysed: '+r.length;setTimeout(loop,250)}stop.onclick=()=>{running=false;if(stream)stream.getTracks().forEach(t=>t.stop());video.srcObject=null;start.disabled=false;stop.disabled=true}</script></body></html>
